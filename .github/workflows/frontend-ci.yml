name: Frontend CI

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - "frontend/**"
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/frontend-ci.yml"

jobs:
  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8081
      NEXT_PUBLIC_APP_ENV: test
      NEXT_PUBLIC_SENTRY_DSN: ""
      NEXT_PUBLIC_SENTRY_RELEASE: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: frontend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: marketplace_ai
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d marketplace_ai"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:55432/marketplace_ai?sslmode=disable
      ENCRYPTION_KEY: "01234567890123456789012345678901"
      JWT_SECRET: dev-jwt-secret
      APP_ENV: local
      AI_PROVIDER_MODE: fake
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3002
      BACKEND_PORT: "8081"
      BACKEND_PROXY_URL: http://localhost:8081
      BACKEND_INTERNAL_URL: http://localhost:8081
      NEXT_PUBLIC_API_BASE_URL: ""
      E2E_BASE_URL: http://localhost:3000
      REDIS_ADDR: localhost:6379
      S3_ENDPOINT: localhost:19000
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio123
      S3_BUCKET_RAW: raw-payloads
      S3_BUCKET_EXPORTS: exports
      S3_BUCKET_ARTIFACTS: artifacts
      S3_USE_SSL: "false"
      SELLER_AI_PIPELINE_ENABLED: "true"
      ACTIONS_AI_FIRST: "true"
      LEGACY_AI_POST_SYNC_ENABLED: "false"
      UNIFIED_ANALYSIS_ROLLOUT_ENABLED: "true"
      UNIFIED_ANALYSIS_LEGACY_FALLBACK_ENABLED: "true"
      E2E_SKIP_WEB_SERVER: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Start MinIO
        run: |
          docker run -d --name minio-e2e -p 19000:9000 \
            -e MINIO_ROOT_USER=minio \
            -e MINIO_ROOT_PASSWORD=minio123 \
            minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:19000/minio/health/live >/dev/null; then
              break
            fi
            sleep 1
          done
          docker run --rm --network host --entrypoint /bin/sh \
            minio/mc:RELEASE.2025-04-16T18-13-26Z \
            -c "until mc alias set local http://127.0.0.1:19000 minio minio123; do sleep 1; done; \
            mc mb -p local/raw-payloads || true; mc mb -p local/exports || true; mc mb -p local/artifacts || true"

      - name: Run migrations
        run: |
          docker run --rm --network host \
            -v "${{ github.workspace }}/backend/migrations:/migrations" \
            migrate/migrate \
            -path /migrations \
            -database "$DATABASE_URL" up

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Start backend API
        working-directory: backend
        run: |
          go run ./cmd/api/main.go &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8081/health/live >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "backend failed to start"
          exit 1

      - name: Start backend worker
        working-directory: backend
        run: |
          go run ./cmd/worker/main.go &
          sleep 3

      - name: Start frontend
        working-directory: frontend
        run: |
          npm run start &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/health >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "frontend failed to start"
          exit 1

      - name: API connectivity smoke test
        working-directory: frontend
        run: npm run test:smoke

      - name: E2E tests
        working-directory: frontend
        env:
          E2E_SKIP_WEB_SERVER: "1"
        # Required Stage-1 runtime smoke + core Actions/chat coverage.
        # @live specs need a pre-seeded demo seller and are excluded.
        run: |
          npx playwright test \
            e2e/main-flow.spec.ts \
            e2e/actions-redesign.spec.ts \
            e2e/ai-chat-ask-ai-handoff.spec.ts \
            e2e/ai-chat-formats-streaming.spec.ts \
            e2e/ai-chat-a11y-smoke.spec.ts \
            e2e/ai-chat-mobile-composer.spec.ts \
            e2e/unified-publication-smoke.spec.ts \
            e2e/z-empty-actions.spec.ts \
            e2e/historical-action.spec.ts \
            --grep-invert @live

