name: Backend CI

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: marketplace_ai_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d marketplace_ai_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    defaults:
      run:
        working-directory: backend

    env:
      APP_ENV: test
      BACKEND_PORT: 8081
      WORKER_METRICS_PORT: 9091
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/marketplace_ai_test?sslmode=disable
      MIGRATIONS_PATH: ./migrations
      REDIS_ADDR: localhost:6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0
      S3_ENDPOINT: localhost:19000
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio123
      S3_BUCKET_RAW: raw-payloads
      S3_BUCKET_EXPORTS: exports
      S3_BUCKET_ARTIFACTS: artifacts
      S3_USE_SSL: "false"
      JWT_SECRET: test-secret-at-least-32-chars-long!!
      ENCRYPTION_KEY: "01234567890123456789012345678901"
      SENTRY_DSN: ""
      SENTRY_RELEASE: ci
      OTEL_ENABLED: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
      OTEL_SERVICE_NAME: marketplace-ai-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: Download modules
        run: go mod download

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Install migrate CLI
        run: |
          go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Run migrations
        run: |
          migrate -path ./migrations -database "$DATABASE_URL" up

      - name: Start MinIO
        run: |
          docker run -d --name minio-ci -p 19000:9000 \
            -e MINIO_ROOT_USER=minio \
            -e MINIO_ROOT_PASSWORD=minio123 \
            minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:19000/minio/health/live >/dev/null; then
              break
            fi
            sleep 1
          done
          docker run --rm --network host --entrypoint /bin/sh \
            minio/mc:RELEASE.2025-04-16T18-13-26Z \
            -c "until mc alias set local http://127.0.0.1:19000 minio minio123; do sleep 1; done; \
            mc mb -p local/raw-payloads || true; mc mb -p local/exports || true; mc mb -p local/artifacts || true"

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/marketplace_ai_test?sslmode=disable
        run: go test ./...

      - name: Run integration tests
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/marketplace_ai_test?sslmode=disable
          TEST_REDIS_ADDR: localhost:6379
          TEST_S3_ENDPOINT: localhost:19000
          AI_PROVIDER_MODE: fake
          SELLER_AI_PIPELINE_ENABLED: "true"
          ACTIONS_AI_FIRST: "true"
          LEGACY_AI_POST_SYNC_ENABLED: "false"
          OPENAI_API_KEY: fake
          CI: "true"
        run: go test -tags=integration -p 1 ./...

      - name: Build API
        run: go build -o ./bin/api ./cmd/api

      - name: Build Worker
        run: go build -o ./bin/worker ./cmd/worker