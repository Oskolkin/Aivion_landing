# Aivion production / staging stack.
# DEV local stack remains at repo-root docker-compose.yml — do not overwrite it.
#
# Runtime prerequisites on the host (not in git):
#   /opt/aivion/shared/runtime.env  — generated during bootstrap (contains DATABASE_URL, etc.)
#   /etc/aivion/secrets/*           — Docker secret source files (never commit values)
#
# Image pins (required; defaults force an explicit set):
#   AIVION_IMAGE_TAG    — git SHA or release tag used as the image tag
#   AIVION_IMAGE_DIGEST — optional; deploy.sh verifies digests after pull
#
# Only the reverse proxy publishes host ports (80/443).

name: aivion

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    image: caddy:2.9-alpine@sha256:b4e3952384eb9524a887633ce65c752dd7c71314d2c2acf98cd5c715aaa534f0
    # Caddy terminates TLS with automatic Let's Encrypt certificates (HTTP-01),
    # so we avoid managing certbot timers / manual renewals on the host.
    restart: unless-stopped
    # Reap zombie children from healthcheck/probes (BusyBox wget/ssl_client).
    # Without init, Caddy as PID 1 does not wait() on exited helpers.
    init: true
    security_opt:
      - no-new-privileges:true
    depends_on:
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL must be set}
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      # Host-managed static audit bundles (see deploy/scripts/*-external-audit.sh).
      - /opt/aivion/shared/external-audit/published:/srv/external-audit/published:ro
      # Host-managed Live Seller Review site snippet (token never in Git).
      - /etc/aivion/live-review.caddy:/etc/caddy/live-review.caddy:ro
    secrets:
      - staging_basic_auth
    networks:
      - aivion_internal
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
        reservations:
          memory: 64M
    healthcheck:
      # Probe the internal-only plain-HTTP :9080 /healthz site in Caddyfile.
      # Never probe :80/:443 or public domains — BusyBox wget follows HTTPS
      # redirects and leaves unreaped ssl_client zombies when Caddy is PID 1.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    image: ghcr.io/oskolkin/aivion-frontend:${AIVION_IMAGE_TAG:?AIVION_IMAGE_TAG must be set explicitly}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      backend-api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: ""
      BACKEND_PROXY_URL: http://backend-api:8081
      BACKEND_INTERNAL_URL: http://backend-api:8081
    networks:
      - aivion_internal
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s

  backend-api:
    image: ghcr.io/oskolkin/aivion-backend:${AIVION_IMAGE_TAG:?AIVION_IMAGE_TAG must be set explicitly}
    # Image is expected to ship /app/api and /app/admin (admin used by create-admin.sh).
    command: ["/app/api"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      ai-egress:
        condition: service_healthy
    env_file:
      - /opt/aivion/shared/runtime.env
    environment:
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
      DATABASE_URL_FILE: /run/secrets/database_url
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      ENCRYPTION_KEY_FILE: /run/secrets/encryption_key
      METRICS_AUTH_TOKEN_FILE: /run/secrets/metrics_auth_token
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      S3_ACCESS_KEY_FILE: /run/secrets/minio_root_user
      S3_SECRET_KEY_FILE: /run/secrets/minio_root_password
      # OpenAI-only egress. Never set HTTP_PROXY/HTTPS_PROXY here.
      AI_HTTPS_PROXY: http://ai-egress:10809
      # One-off Ozon OAuth acceptance probe values. Passed only at runtime and
      # cleared by the operator immediately after the callback completes.
      OZON_OAUTH_CLIENT_ID: ${OZON_OAUTH_CLIENT_ID:-}
      OZON_OAUTH_CLIENT_SECRET: ${OZON_OAUTH_CLIENT_SECRET:-}
      OZON_OAUTH_EXPECTED_STATE: ${OZON_OAUTH_EXPECTED_STATE:-}
    secrets:
      - openai_api_key
      - jwt_secret
      - encryption_key
      - metrics_auth_token
      - database_url
      - redis_password
      - minio_root_user
      - minio_root_password
    networks:
      - aivion_internal
      - aivion_ai_egress
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 768M
        reservations:
          memory: 384M
    healthcheck:
      # /health/ready gates traffic / depends_on; use /health/live for process-only probes.
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8081/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s

  backend-worker:
    image: ghcr.io/oskolkin/aivion-worker:${AIVION_IMAGE_TAG:?AIVION_IMAGE_TAG must be set explicitly}
    command: ["/app/worker"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      backend-api:
        condition: service_healthy
      ai-egress:
        condition: service_healthy
    env_file:
      - /opt/aivion/shared/runtime.env
    environment:
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
      DATABASE_URL_FILE: /run/secrets/database_url
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      ENCRYPTION_KEY_FILE: /run/secrets/encryption_key
      METRICS_AUTH_TOKEN_FILE: /run/secrets/metrics_auth_token
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      S3_ACCESS_KEY_FILE: /run/secrets/minio_root_user
      S3_SECRET_KEY_FILE: /run/secrets/minio_root_password
      AI_HTTPS_PROXY: http://ai-egress:10809
    secrets:
      - openai_api_key
      - jwt_secret
      - encryption_key
      - metrics_auth_token
      - database_url
      - redis_password
      - minio_root_user
      - minio_root_password
    networks:
      - aivion_internal
      - aivion_ai_egress
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 1536M
        reservations:
          memory: 512M

  # Internal OpenAI egress (official Xray). Config is host secret — never commit VLESS/Reality material.
  # HTTP inbound :10809 on aivion_ai_egress only (not published). App uses AI_HTTPS_PROXY only.
  # Attached only to aivion_ai_egress — frontend/caddy/postgres/redis/minio are not on that network.
  ai-egress:
    image: ghcr.io/xtls/xray-core:26.7.28@sha256:b697cda1588faca696ab7f7755dd1161f60862af3ff6026300e44cff6aedd558
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    # Operator-provided Xray JSON (fresh HAPP export). Distroless runs as UID 65532 — host file must be readable by that UID.
    volumes:
      - /etc/aivion/secrets/ai-egress-config.json:/etc/xray/config.json:ro
    # Override default -confdir; single operator file is the source of truth.
    command: ["run", "-c", "/etc/xray/config.json"]
    networks:
      - aivion_ai_egress
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          memory: 64M
    healthcheck:
      # Config parse/test only. No shell (distroless), no external/OpenAI probes, no config dump.
      test: ["CMD", "/usr/local/bin/xray", "run", "-test", "-c", "/etc/xray/config.json"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: marketplace_ai
      POSTGRES_USER: aivion
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aivion_internal
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
        reservations:
          memory: 512M
    # No host ports — reachable only on aivion_internal.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aivion -d marketplace_ai"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command:
      [
        "/bin/sh",
        "-c",
        "redis-server --requirepass \"$$(cat /run/secrets/redis_password)\" --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru",
      ]
    secrets:
      - redis_password
    volumes:
      - redis_data:/data
    networks:
      - aivion_internal
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 320M
        reservations:
          memory: 128M
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a \"$$(cat /run/secrets/redis_password)\" ping | grep -q PONG",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z@sha256:ed9be66eb5f2636c18289c34c3b725ddf57815f2777c77b5938543b78a44f144
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: server /data --address ":9000" --console-address ":9001"
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
    secrets:
      - minio_root_user
      - minio_root_password
    volumes:
      - minio_data:/data
    networks:
      - aivion_internal
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s

  minio-init:
    # Immutable pin: release tag + digest (no :latest).
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_healthy
    secrets:
      - minio_root_user
      - minio_root_password
    networks:
      - aivion_internal
    restart: "on-failure"
    logging: *default-logging
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -euo pipefail
        USER="$$(cat /run/secrets/minio_root_user)"
        PASS="$$(cat /run/secrets/minio_root_password)"
        until mc alias set local http://minio:9000 "$$USER" "$$PASS"; do sleep 2; done
        mc mb -p local/raw-payloads || true
        mc mb -p local/exports || true
        mc mb -p local/artifacts || true
        mc anonymous set none local/raw-payloads || true
        mc anonymous set none local/exports || true
        mc anonymous set none local/artifacts || true
        echo "minio buckets ready"

  migrations:
    image: migrate/migrate:v4.18.1@sha256:f21c436af23c282f4516b00ba3e93bccf5c5fe5cd52530fd5c319a936998f539
    depends_on:
      postgres:
        condition: service_healthy
    secrets:
      - database_url
    volumes:
      # Resolved from compose file location when deploying from a repo checkout.
      - ${AIVION_MIGRATIONS_PATH:-../../backend/migrations}:/migrations:ro
    networks:
      - aivion_internal
    restart: "no"
    logging: *default-logging
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -euo pipefail
        DATABASE_URL="$$(cat /run/secrets/database_url)"
        migrate -path /migrations -database "$$DATABASE_URL" up

networks:
  aivion_internal:
    name: aivion_internal
    driver: bridge
    # App data plane. Isolation from host: only Caddy publishes 80/443.
  # OpenAI proxy plane: only backend-api, backend-worker, and ai-egress.
  # Not internal:true — ai-egress must reach the VLESS upstream on the public internet.
  aivion_ai_egress:
    name: aivion_ai_egress
    driver: bridge

volumes:
  postgres_data:
    name: aivion_postgres_data
  redis_data:
    name: aivion_redis_data
  minio_data:
    name: aivion_minio_data
  caddy_data:
    name: aivion_caddy_data
  caddy_config:
    name: aivion_caddy_config

secrets:
  openai_api_key:
    file: /etc/aivion/secrets/openai_api_key
  postgres_password:
    file: /etc/aivion/secrets/postgres_password
  redis_password:
    file: /etc/aivion/secrets/redis_password
  minio_root_user:
    file: /etc/aivion/secrets/minio_root_user
  minio_root_password:
    file: /etc/aivion/secrets/minio_root_password
  jwt_secret:
    file: /etc/aivion/secrets/jwt_secret
  encryption_key:
    file: /etc/aivion/secrets/encryption_key
  metrics_auth_token:
    file: /etc/aivion/secrets/metrics_auth_token
  database_url:
    file: /etc/aivion/secrets/database_url
  # Caddy snippet containing a basic_auth { ... } block (htpasswd/bcrypt hashes).
  staging_basic_auth:
    file: /etc/aivion/secrets/staging_basic_auth
