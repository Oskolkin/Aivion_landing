name: Docker CI

permissions:
  contents: read

concurrency:
  group: docker-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - "backend/**"
      - "frontend/**"
      - "deploy/**"
      - ".github/workflows/docker-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "deploy/**"
      - ".github/workflows/docker-ci.yml"

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate production compose contracts
        run: bash ./deploy/scripts/compose-validate.sh

      - name: Build backend image
        run: docker build -t marketplace-ai-backend:ci -f ./backend/Dockerfile ./backend

      - name: Build worker image
        run: docker build -t marketplace-ai-worker:ci -f ./backend/Dockerfile.worker ./backend

      - name: Build frontend image
        run: docker build -t marketplace-ai-frontend:ci ./frontend
