name: Manual Staging Deploy

permissions:
  contents: read
  actions: read
  checks: read

concurrency:
  group: staging-manual-deploy
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      image_sha:
        description: "Commit SHA whose GHCR images to deploy"
        required: true
      confirm:
        description: 'Type "staging" to confirm'
        required: true

jobs:
  staging-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Validate confirm input
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.confirm }}" != "staging" ]; then
            echo "::error::confirm must equal exactly 'staging'"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize and verify image_sha on main
        id: sha
        run: |
          set -euo pipefail
          RAW="${{ github.event.inputs.image_sha }}"
          RAW="$(echo "$RAW" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          if ! echo "$RAW" | grep -Eq '^[0-9a-f]{7,40}$'; then
            echo "::error::image_sha must be a hex commit SHA"
            exit 1
          fi
          git fetch origin main --prune
          RESOLVED="$(git rev-parse --verify "${RAW}^{commit}")"
          if ! git merge-base --is-ancestor "$RESOLVED" origin/main; then
            echo "::error::image_sha $RESOLVED is not an ancestor of origin/main"
            exit 1
          fi
          echo "full=$RESOLVED" >> "$GITHUB_OUTPUT"
          echo "short=${RESOLVED:0:12}" >> "$GITHUB_OUTPUT"
          echo "Deploy SHA: $RESOLVED"

      - name: Verify required CI conclusions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="${{ steps.sha.outputs.full }}"
          REPO="${{ github.repository }}"
          REQUIRED=("Backend CI" "Frontend CI" "Docker CI" "Secret Scan")
          MISSING=0

          echo "Checking workflow conclusions for $SHA ..."
          RUNS_JSON="$(gh api "repos/${REPO}/actions/runs?head_sha=${SHA}&per_page=100")"

          for NAME in "${REQUIRED[@]}"; do
            CONCLUSION="$(echo "$RUNS_JSON" | jq -r --arg n "$NAME" '
              [.workflow_runs[] | select(.name == $n) | .conclusion] | first // empty
            ')"
            STATUS="$(echo "$RUNS_JSON" | jq -r --arg n "$NAME" '
              [.workflow_runs[] | select(.name == $n) | .status] | first // empty
            ')"
            if [ -z "$CONCLUSION" ]; then
              echo "::error::Required check missing: '$NAME' (no workflow run found for this SHA)"
              MISSING=1
              continue
            fi
            if [ "$STATUS" != "completed" ] || [ "$CONCLUSION" != "success" ]; then
              echo "::error::Required check failed: '$NAME' status=$STATUS conclusion=$CONCLUSION"
              MISSING=1
              continue
            fi
            echo "OK: $NAME => $CONCLUSION"
          done

          if [ "$MISSING" -ne 0 ]; then
            echo "::error::One or more required CI checks are missing or not successful for $SHA"
            echo "Ensure Backend CI, Frontend CI, Docker CI, and Secret Scan have completed successfully on this commit."
            exit 1
          fi

      - name: Print GHCR image refs
        run: |
          set -euo pipefail
          SHA="${{ steps.sha.outputs.full }}"
          {
            echo "## Staging deploy image refs"
            echo ""
            echo "- \`ghcr.io/oskolkin/aivion-backend:${SHA}\`"
            echo "- \`ghcr.io/oskolkin/aivion-worker:${SHA}\`"
            echo "- \`ghcr.io/oskolkin/aivion-frontend:${SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/oskolkin/aivion-backend:${SHA}"
          echo "ghcr.io/oskolkin/aivion-worker:${SHA}"
          echo "ghcr.io/oskolkin/aivion-frontend:${SHA}"

      - name: Deploy via SSH (if secrets configured)
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          set -euo pipefail
          SHA="${{ steps.sha.outputs.full }}"

          if [ -z "${STAGING_SSH_HOST:-}" ] || [ -z "${STAGING_SSH_USER:-}" ] || [ -z "${STAGING_SSH_KEY:-}" ]; then
            echo "SSH deploy secrets are not configured (STAGING_SSH_HOST / STAGING_SSH_USER / STAGING_SSH_KEY)."
            echo ""
            echo "First staging deploy must be done manually from a trusted machine:"
            echo "  1. Ensure GHCR images for ${SHA} are published (Docker Publish workflow)."
            echo "  2. SSH via local alias, e.g.:  ssh aivion-staging"
            echo "     (or: ssh deploy@<staging-host>)"
            echo "  3. Run:"
            echo "       /opt/aivion/deploy/scripts/deploy.sh ${SHA}"
            echo ""
            echo "This workflow never auto-deploys on push."
            {
              echo ""
              echo "### Manual deploy required"
              echo "SSH secrets missing. Run locally:"
              echo "\`\`\`"
              echo "ssh aivion-staging"
              echo "/opt/aivion/deploy/scripts/deploy.sh ${SHA}"
              echo "\`\`\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Write key to a restricted temp file; never echo the key material.
          KEY_FILE="$(mktemp)"
          trap 'rm -f "$KEY_FILE"' EXIT
          umask 077
          printf '%s\n' "$STAGING_SSH_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh -i "$KEY_FILE" \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o IdentitiesOnly=yes \
            "${STAGING_SSH_USER}@${STAGING_SSH_HOST}" \
            "/opt/aivion/deploy/scripts/deploy.sh ${SHA}"
